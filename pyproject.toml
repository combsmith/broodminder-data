[project]
name = "broodminder-data"
version = "0.1.5"
description = "Unified Python client, CLI, bulk export, periodic delta sync, OpenAPI 3.1 spec, and MCP server for BroodMinder beehive data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["broodminder", "beekeeping", "iot", "data-export", "api", "mcp", "openapi", "cli"]
authors = [
    { name = "Don Petry" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0; python_version >= '3.10'",
]
build = [
    "build>=1.0",
    "twine>=5.0",
]
dev = [
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
broodminder-battery = "bm.battery:main"

[project.urls]
Homepage = "https://github.com/petry-projects/broodminder-data"
Documentation = "https://github.com/petry-projects/broodminder-data#readme"
Changelog = "https://github.com/petry-projects/broodminder-data/blob/main/CHANGELOG.md"
Issues = "https://github.com/petry-projects/broodminder-data/issues"
Discussions = "https://github.com/petry-projects/broodminder-data/discussions"
Repository = "https://github.com/petry-projects/broodminder-data.git"
"Commercial Support" = "https://combsmith.com"

[tool.setuptools]
packages = ["bm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -ra"
markers = [
    "live: test hits the live BroodMinder API; skipped without BROODMINDER_API_KEY",
    "compliance: repo-compliance checks; manage their own credentials (or skip) and run regardless of BROODMINDER_API_KEY",
]

[tool.coverage.run]
branch = true
# Measure from the project root so coverage.xml records package-qualified,
# project-root-relative paths ("bm/battery.py", "scripts/battery.py"). Scoping
# to two sibling package roots instead (source = ["bm", "scripts"]) made
# coverage strip both prefixes to a bare "battery.py", colliding the two files
# into one record — SonarCloud then matched almost nothing and reported ~1%
# coverage on new code. relative_files keeps the paths repo-relative so the
# SonarCloud importer resolves them against sonar.sources. See sonarcloud.yml.
source = ["."]
relative_files = true
omit = ["tests/*", ".venv/*", "*/__pycache__/*", "setup.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_also = [
    # CLI entry guards only run on direct execution, not under import-based tests.
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
